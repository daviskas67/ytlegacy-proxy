name: Android build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-30" "build-tools;30.0.3"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "7.5.1"

      - name: Run JVM unit tests
        working-directory: ytlegacy-android
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Assemble debug APK
        working-directory: ytlegacy-android
        run: gradle --no-daemon :app:assembleDebug

      - name: Build unified YouTube + ytlegacy APK
        run: bash scripts/build-unified-apk.sh

      - name: Upload unified APK
        uses: actions/upload-artifact@v4
        with:
          name: ytlegacy-unified-v1.16
          path: ytlegacy-android/build/unified/ytlegacy-5.0.21-v1.16-unified.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish v1.6 GitHub Release
        if: github.event_name == 'push' && github.event.head_commit.message == 'release v1.6'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="ytlegacy-android/app/build/outputs/apk/debug/app-debug.apk"
          if gh release view v1.6 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.6 "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v1.6 "$APK" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "ytlegacy-proxy v1.6" \
              --generate-notes
          fi

      - name: Publish v1.7 GitHub Release
        if: github.event_name == 'push' && github.event.head_commit.message == 'release v1.7'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="ytlegacy-android/app/build/outputs/apk/debug/app-debug.apk"
          if gh release view v1.7 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.7 "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v1.7 "$APK" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "ytlegacy-proxy v1.7" \
              --generate-notes
          fi

      - name: Publish v1.9 GitHub Release
        if: github.event_name == 'push' && github.event.head_commit.message == 'release v1.9'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="ytlegacy-android/app/build/outputs/apk/debug/app-debug.apk"
          ASSET="ytlegacy-proxy-v1.9.apk"
          cp "$APK" "$ASSET"
          if gh release view v1.9 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.9 "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v1.9 "$ASSET" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "ytlegacy-proxy v1.9" \
              --notes "ytlegacy-proxy v1.9. Fixes legacy YouTube Data API v3 protobuf feed responses and removes the version suffix from the Android app name."
          fi

      - name: Publish v1.10 GitHub Release
        if: github.event_name == 'push' && github.event.head_commit.message == 'release v1.10'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="ytlegacy-android/app/build/outputs/apk/debug/app-debug.apk"
          ASSET="ytlegacy-proxy-v1.10.apk"
          cp "$APK" "$ASSET"
          if gh release view v1.10 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.10 "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v1.10 "$ASSET" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "ytlegacy-proxy v1.10" \
              --notes "ytlegacy-proxy v1.10 adds HTTPS-only community Invidious candidates and a read-only Piped fallback for public search and trending feeds."
          fi

      - name: Publish v1.11 GitHub Release
        if: github.event_name == 'push' && github.event.head_commit.message == 'release v1.11'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="ytlegacy-android/app/build/outputs/apk/debug/app-debug.apk"
          ASSET="ytlegacy-proxy-v1.11.apk"
          cp "$APK" "$ASSET"
          if gh release view v1.11 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.11 "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v1.11 "$ASSET" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "ytlegacy-proxy v1.11" \
              --notes "ytlegacy-proxy v1.11 adds yt2009 gsign device linking, account channel selection, and personalized recommendations from the pinned femboy.email instance."
          fi

      - name: Publish v1.12 GitHub Release
        if: github.event_name == 'push' && github.event.head_commit.message == 'release v1.12'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="ytlegacy-android/app/build/outputs/apk/debug/app-debug.apk"
          ASSET="ytlegacy-proxy-v1.12.apk"
          cp "$APK" "$ASSET"
          if gh release view v1.12 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.12 "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v1.12 "$ASSET" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "ytlegacy-proxy v1.12" \
              --notes "ytlegacy-proxy v1.12 adds automatic yt2009 gsign status polling and a channel-picker prompt."
          fi

      - name: Publish v1.13 GitHub Release
        if: github.event_name == 'push' && github.event.head_commit.message == 'release v1.13'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="ytlegacy-android/app/build/outputs/apk/debug/app-debug.apk"
          ASSET="ytlegacy-proxy-v1.13.apk"
          cp "$APK" "$ASSET"
          if gh release view v1.13 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.13 "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v1.13 "$ASSET" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "ytlegacy-proxy v1.13" \
              --notes "ytlegacy-proxy v1.13 adds a shareable sign-in guide and clearer account/channel status."
          fi

      - name: Publish v1.14 GitHub Release
        if: github.event_name == 'push' && github.event.head_commit.message == 'release v1.14'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="ytlegacy-android/app/build/outputs/apk/debug/app-debug.apk"
          ASSET="ytlegacy-proxy-v1.14.apk"
          cp "$APK" "$ASSET"
          if gh release view v1.14 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.14 "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v1.14 "$ASSET" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "ytlegacy-proxy v1.14" \
              --notes "ytlegacy-proxy v1.14 makes yt2009 account linking optional and fixes proxy stream cleanup and fallback handling."
          fi

      - name: Publish v1.15 GitHub Release
        if: github.event_name == 'push' && github.event.head_commit.message == 'release v1.15'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="ytlegacy-android/app/build/outputs/apk/debug/app-debug.apk"
          ASSET="ytlegacy-proxy-v1.15.apk"
          cp "$APK" "$ASSET"
          if gh release view v1.15 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.15 "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v1.15 "$ASSET" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "ytlegacy-proxy v1.15" \
              --notes "ytlegacy-proxy v1.15 adds multi-provider video playback, Piped stream support, yt2009 community-instance stream failover, byte-range handling, and playback diagnostics."
          fi

      - name: Publish unified v1.16 GitHub Release
        if: github.event_name == 'push' && github.event.head_commit.message == 'release v1.16'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="ytlegacy-android/build/unified/ytlegacy-5.0.21-v1.16-unified.apk"
          ASSET="ytlegacy-5.0.21-v1.16-unified.apk"
          if gh release view v1.16 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.16 "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          else
            cp "$APK" "$ASSET"
            gh release create v1.16 "$ASSET" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "ytlegacy YouTube 5.0.21 + proxy v1.16" \
              --notes "Single-APK integration of the patched YouTube 5.0.21 client and ytlegacy-proxy. The local proxy auto-starts with YouTube and has its own entry in YouTube Settings."
          fi
