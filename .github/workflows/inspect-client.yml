name: Inspect bundled ytlegacy client

on:
  push:
    branches: [ feat/source-manager-tests-v1.15 ]
    paths:
      - ".github/workflows/inspect-client.yml"
      - "release/youtube-5.0.21-ytlegacy-v1.3-FINAL.apk"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install APK inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool unzip
          sdkmanager "platforms;android-30" "build-tools;30.0.3"

      - name: Decode and inspect client APK
        run: |
          mkdir -p inspection
          APK="release/youtube-5.0.21-ytlegacy-v1.3-FINAL.apk"
          aapt="$ANDROID_HOME/build-tools/30.0.3/aapt"
          "$aapt" dump badging "$APK" > inspection/badging.txt
          "$aapt" dump xmltree "$APK" AndroidManifest.xml > inspection/manifest-tree.txt
          unzip -l "$APK" > inspection/zip-list.txt
          apktool d -f "$APK" -o inspection/decoded
          cp "$APK" inspection/youtube-5.0.21-ytlegacy-v1.3-FINAL.apk
          {
            echo "## APK summary"
            grep -E "^(package:|sdkVersion:|targetSdkVersion:|application-label:|application:|launchable-activity:|uses-permission:)" inspection/badging.txt || true
            echo
            echo "## DEX files"
            unzip -Z1 "$APK" | grep -E '(^|/)classes([0-9]+)?\.dex$' || true
            echo
            echo "## Components and application"
            grep -E "E: (application|activity|activity-alias|service|receiver|provider)|A: android:name" inspection/manifest-tree.txt | head -n 240 || true
            echo
            echo "## Decoded smali roots"
            find inspection/decoded -maxdepth 1 -type d -name 'smali*' -print
            echo
            echo "## Patched app markers"
            grep -R -n -E 'org\.ytlegacy\.daviskas\.app|ytlegacy' inspection/decoded/smali* 2>/dev/null | head -n 120 || true
          } > inspection/REPORT.md

      - name: Upload decoded client and inspection report
        uses: actions/upload-artifact@v4
        with:
          name: ytlegacy-client-inspection
          path: inspection/
          if-no-files-found: error
          retention-days: 3
